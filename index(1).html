*{box-sizing:border-box}body{margin:0;background:#071426;color:#fff;font-family:Inter,system-ui,Segoe UI,Arial;min-height:100vh;overflow-x:hidden}button{font:inherit;color:#fff;border:0;cursor:pointer}#app{min-height:100vh;background:radial-gradient(circle at 10% 15%,#22d3ee20,transparent 30%),radial-gradient(circle at 90% 10%,#8b5cf620,transparent 30%),linear-gradient(145deg,#061121,#0b1d35 55%,#071426)}.screen{display:none;min-height:100vh;padding:18px}.screen.active{display:flex}.home{align-items:center;justify-content:center}.wrap{width:min(1120px,100%);margin:auto}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-weight:1000;background:linear-gradient(135deg,#22d3ee,#6366f1,#ec4899);box-shadow:0 10px 35px #22d3ee33}.brand b{font-size:21px;letter-spacing:1.5px}.brand small{display:block;color:#8298b2;font-size:9px;letter-spacing:2px}.hero{display:grid;grid-template-columns:1fr .9fr;gap:28px;align-items:center}.copy{padding:10px}.eyebrow{font-size:11px;color:#67e8f9;font-weight:900;letter-spacing:3px}h1{font-size:clamp(55px,8vw,105px);line-height:.82;letter-spacing:-5px;margin:14px 0}h1 span{display:block;background:linear-gradient(100deg,#fff,#67e8f9,#c084fc,#f472b6);color:transparent;background-clip:text}.tag{color:#a8bad0;font-size:18px;margin-bottom:25px}.buttons{display:flex;gap:10px;flex-wrap:wrap}.btn{padding:13px 18px;border-radius:14px;background:#ffffff0d;border:1px solid #ffffff14;font-weight:900;box-shadow:0 9px 25px #0003;transition:.18s}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.primary{background:linear-gradient(135deg,#06b6d4,#6366f1);box-shadow:0 12px 35px #06b6d455}.gold{background:linear-gradient(135deg,#f59e0b,#ef4444)}.small{padding:9px 12px;font-size:12px}.stats{display:flex;gap:9px;flex-wrap:wrap;margin-top:23px}.stat{background:#ffffff09;border:1px solid #ffffff10;border-radius:13px;padding:9px 13px}.stat small{display:block;color:#758ca7;font-size:9px}.stat b{font-size:18px}.preview{height:500px;border-radius:30px;border:1px solid #ffffff14;background:linear-gradient(145deg,#ffffff10,#ffffff03);box-shadow:0 30px 80px #0006;display:flex;align-items:center;justify-content:center;overflow:hidden}.tubes{display:flex;gap:14px;align-items:flex-end;transform:rotate(-3deg)}.tube{width:60px;height:185px;border:3px solid #ffffff55;border-top:0;border-radius:0 0 30px 30px;position:relative;overflow:hidden;background:linear-gradient(90deg,#fff2,#fff0,#fff2);box-shadow:inset 8px 0 14px #fff2,inset -8px 0 14px #0002,0 16px 35px #0005}.layer{position:absolute;left:4px;right:4px;height:25%;border-radius:9px 9px 24px 24px;box-shadow:inset 0 4px 7px #fff5,0 -4px 15px #fff2}.game{align-items:stretch;justify-content:center}.gamewrap{width:min(1180px,100%);display:flex;flex-direction:column;min-height:calc(100vh - 36px)}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.hud{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.pill{padding:8px 11px;border-radius:11px;background:#ffffff0b;border:1px solid #ffffff10;font-size:11px}.boardbox{flex:1;min-height:520px;border-radius:28px;border:1px solid #ffffff12;background:radial-gradient(circle at 50% 0,#38bdf81b,transparent 45%),linear-gradient(180deg,#ffffff0b,#ffffff03);box-shadow:0 25px 70px #0006;padding:20px;display:flex;flex-direction:column}.title{text-align:center}.title small{color:#8196b0;font-weight:900;letter-spacing:2px}.title h2{margin:5px 0;font-size:25px}.bar{height:7px;max-width:520px;margin:10px auto;background:#ffffff0a;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#818cf8,#f472b6);transition:.3s}.board{flex:1;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:20px;max-width:900px;width:100%;margin:auto}.gameTube{width:70px;height:220px;cursor:pointer;transition:.18s;position:relative}.gameTube.selected{transform:translateY(-14px);filter:brightness(1.15);box-shadow:0 0 0 3px #67e8f955,0 20px 40px #22d3ee22}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.control{min-width:105px}.control span{display:block;font-size:19px}.control:disabled{opacity:.35;cursor:not-allowed}.levels{align-items:flex-start;justify-content:center}.levelgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px}.level{min-height:105px;text-align:left;border-radius:16px;padding:13px;background:#ffffff09;border:1px solid #ffffff10}.level.lock{opacity:.35}.level b{font-size:20px}.level small{display:block;color:#8196b0;margin-top:4px}.stars{color:#fbbf24;margin-top:8px}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#020814c9;backdrop-filter:blur(12px);z-index:50;padding:20px}.overlay.show{display:flex}.modal{width:min(520px,100%);text-align:center;padding:28px;border-radius:25px;background:linear-gradient(145deg,#10243d,#0b1729);border:1px solid #ffffff16;box-shadow:0 30px 100px #0009}.modal h2{font-size:32px;margin:5px}.modal p{color:#91a7c0}.modalstars{font-size:40px;color:#fbbf24;letter-spacing:5px;margin:14px}.modal-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;z-index:70;background:#12263e;border:1px solid #ffffff18;padding:11px 16px;border-radius:13px;font-weight:800;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.conf{position:fixed;top:-20px;width:8px;height:14px;z-index:60;animation:fall 1.8s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}@media(max-width:760px){.hero{grid-template-columns:1fr}.copy{text-align:center}.buttons,.stats{justify-content:center}.preview{height:330px;order:-1}.preview .tube{width:42px;height:135px}.top{align-items:flex-start}.hud{max-width:70%}.boardbox{min-height:calc(100vh - 100px);padding:13px;border-radius:20px}.board{gap:13px}.gameTube{width:56px;height:180px}.control{min-width:78px;padding:10px 8px}.levelgrid{grid-template-columns:repeat(3,1fr)}.level{min-height:85px;padding:9px}.level b{font-size:17px}}@media(max-width:390px){.gameTube{width:49px;height:158px}.board{gap:9px}.levelgrid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div id="app">
<section id="home" class="screen active"><div class="wrap"><div class="brand"><div class="logo">PX</div><div><b>PLAYVEXA</b><small>ORIGINAL BROWSER GAMES</small></div></div><div class="hero"><div class="copy"><div class="eyebrow">PUZZLE • SORT • MASTER</div><h1><span>COLOR SORT</span><span>RUSH</span></h1><div class="tag">Sort. Match. Master.</div><div class="buttons"><button class="btn primary" onclick="start(1)">▶ PLAY NOW</button><button class="btn" onclick="levels()">▦ LEVELS</button><button class="btn gold" onclick="daily()">🔥 DAILY</button></div><div class="stats"><div class="stat"><small>LEVEL</small><b id="hl">1</b></div><div class="stat"><small>COINS</small><b id="hc">250</b></div><div class="stat"><small>STARS</small><b id="hs">0</b></div><div class="stat"><small>BEST</small><b id="hb">0</b></div></div></div><div class="preview"><div class="tubes"><div class="tube"><i class="layer" style="bottom:0;background:linear-gradient(#fecdd3,#fb7185,#e11d48)"></i><i class="layer" style="bottom:25%;background:linear-gradient(#ddd6fe,#a78bfa,#7c3aed)"></i></div><div class="tube"><i class="layer" style="bottom:0;background:linear-gradient(#a7f3d0,#34d399,#059669)"></i><i class="layer" style="bottom:25%;background:linear-gradient(#a5f3fc,#22d3ee,#0891b2)"></i></div><div class="tube"><i class="layer" style="bottom:0;background:linear-gradient(#fef3c7,#fbbf24,#d97706)"></i><i class="layer" style="bottom:25%;background:linear-gradient(#fecdd3,#fb7185,#e11d48)"></i></div><div class="tube"><i class="layer" style="bottom:0;background:linear-gradient(#bfdbfe,#60a5fa,#2563eb)"></i><i class="layer" style="bottom:25%;background:linear-gradient(#a7f3d0,#34d399,#059669)"></i></div></div></div></div></div></section>
<section id="levels" class="screen levels"><div class="wrap"><button class="btn small" onclick="home()">← BACK</button><div class="brand" style="margin-top:18px"><div class="logo">PX</div><div><b>LEVEL SELECT</b><small>MASTER EVERY COLOR</small></div></div><div id="grid" class="levelgrid"></div></div></section>
<section id="game" class="screen game"><div class="gamewrap"><div class="top"><button class="btn small" onclick="home()">← HOME</button><div class="hud"><div class="pill">LEVEL <b id="lv">1</b></div><div class="pill">SCORE <b id="sc">0</b></div><div class="pill">🪙 <b id="co">250</b></div><div class="pill">MOVES <b id="mv">∞</b></div><div class="pill">⏱ <b id="tm">∞</b></div></div><div><button class="btn small" onclick="pause()">Ⅱ</button><button class="btn small" onclick="soundToggle()" id="snd">🔊</button><button class="btn small" onclick="full()">⛶</button></div></div><div class="boardbox"><div class="title"><small id="diff">VERY EASY</small><h2 id="lname">LEVEL 1</h2><div class="bar"><i id="prog"></i></div></div><div id="board" class="board"></div><div class="controls"><button id="undo" class="btn control" onclick="undo()"><span>↶</span>UNDO</button><button class="btn control" onclick="hint()"><span>💡</span>HINT · 15</button><button class="btn control" onclick="restart()"><span>↻</span>RESTART</button><button class="btn control" onclick="extra()"><span>＋</span>EXTRA TUBE · 60</button></div><div style="text-align:center;color:#607791;font-size:10px;margin-top:10px">PLAYVEXA • Color Sort Rush</div></div></div></section></div>
<div id="overlay" class="overlay"><div id="modal" class="modal"></div></div><div id="toast" class="toast"></div>
<script>
const C=[['#22d3ee','#0891b2','#a5f3fc'],['#fb7185','#e11d48','#fecdd3'],['#a78bfa','#7c3aed','#ddd6fe'],['#34d399','#059669','#a7f3d0'],['#fbbf24','#d97706','#fef3c7'],['#60a5fa','#2563eb','#bfdbfe'],['#fb923c','#ea580c','#fed7aa'],['#a3e635','#65a30d','#ecfccb'],['#f87171','#dc2626','#fee2e2']];
const K='playvexa_csr_v1';let S=JSON.parse(localStorage.getItem(K)||'null')||{unlocked:1,stars:{},best:{},coins:250,sound:true};let G={};let timer=null,audio=null;
const $=x=>document.getElementById(x),save=()=>localStorage.setItem(K,JSON.stringify(S));
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}function home(){clearInterval(timer);show('home');updateHome()}function updateHome(){$('hl').textContent=S.unlocked;$('hc').textContent=S.coins.toLocaleString();$('hs').textContent=Object.values(S.stars).reduce((a,b)=>a+b,0);$('hb').textContent=Math.max(0,...Object.values(S.best)).toLocaleString()}
function diff(n){return n<=10?'VERY EASY':n<=25?'EASY':n<=45?'MEDIUM':n<=65?'HARD':n<=85?'VERY HARD':'PRO'}
function cfg(n,d=false){let colors=n<=10?3:n<=25?4:n<=45?5:n<=65?6:n<=85?7:Math.min(9,7+Math.floor((n-86)/5));return{colors,tubes:colors+2,cap:4,limit:n>=26?Math.max(28,70-Math.floor(n*.35)):null,time:n>=46?Math.max(45,120-Math.floor(n*.5)):null,daily:d}}
function puzzle(n,d=false){let q=cfg(n,d),a=[];for(let c=0;c<q.colors;c++)for(let i=0;i<4;i++)a.push(c);let seed=(n*9301+49297)%233280,r=()=>{seed=(seed*9301+49297)%233280;return seed/233280};for(let i=a.length-1;i;i--){let j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}let t=Array.from({length:q.tubes},()=>[]);for(let i=0;i<a.length;i++)t[i%(q.tubes-2)].push(a[i]);for(let k=0;k<n*2+25;k++){let x=Math.floor(r()*(q.tubes-2)),y=Math.floor(r()*(q.tubes-2));if(x===y||!t[x].length)continue;let z=1+Math.floor(r()*Math.min(2,t[x].length));let p=t[x].splice(t[x].length-z);if(t[y].length+p.length<=4)t[y].push(...p);else t[x].push(...p)}return t}
function start(n,d=false){clearInterval(timer);let q=cfg(n,d);G={n,t:puzzle(n,d),h:[],score:0,moves:0,combo:0,sel:-1,limit:q.limit,time:d?75:q.time,daily:d,extra:false,noUndo:true,failed:false};show('game');render();runTimer();}
function daily(){start(86,true);toast('🔥 DAILY CHALLENGE · 2× REWARD')}
function render(){let q=cfg(G.n,G.daily);$('lv').textContent=G.daily?'DAILY':G.n;$('sc').textContent=G.score.toLocaleString();$('co').textContent=S.coins.toLocaleString();$('mv').textContent=G.limit==null?'∞':Math.max(0,G.limit-G.moves);$('tm').textContent=G.time==null?'∞':Math.ceil(G.time);$('diff').textContent=G.daily?'DAILY CHALLENGE':diff(G.n);$('lname').textContent=G.daily?'2× REWARD':'LEVEL '+G.n;$('undo').disabled=!G.h.length;let b=$('board');b.innerHTML='';G.t.forEach((t,i)=>{let e=document.createElement('div');e.className='tube gameTube'+(G.sel===i?' selected':'');t.forEach((c,j)=>{let l=document.createElement('i');l.className='layer';l.style.bottom=(j*25+.5)+'%';l.style.background=`linear-gradient(180deg,${C[c][2]},${C[c][0]} 45%,${C[c][1]})`;e.appendChild(l)});e.onclick=()=>clickTube(i);b.appendChild(e)});let full=G.t.filter(t=>t.length===4&&new Set(t).size===1).length;$('prog').style.width=(full/q.colors*100)+'%'}
function clickTube(i){if(G.failed)return;if(G.sel<0){if(!G.t[i].length)return;G.sel=i;render();beep(360);return}if(G.sel===i){G.sel=-1;render();return}move(G.sel,i);G.sel=-1;render()}
function move(x,y){let a=G.t[x],b=G.t[y],cap=4+(G.extra?1:0);if(!a.length||b.length>=cap){G.combo=0;toast('That move is not possible');beep(120);return}let c=a.at(-1);if(b.length&&b.at(-1)!==c){G.combo=0;toast('Match the same color');beep(120);return}let run=0;for(let i=a.length-1;i>=0&&a[i]===c;i--)run++;let n=Math.min(run,cap-b.length);G.h.push(JSON.stringify(G.t));a.splice(a.length-n,n);b.push(...Array(n).fill(c));G.moves++;G.combo++;G.noUndo=true;let gain=50*n+(n>1?100:0)+(G.combo>1?50*G.combo:0);if(G.daily)gain*=2;G.score+=gain;beep(220);if(G.combo>=3)toast('🔥 COMBO ×'+G.combo+'  +'+gain);if(G.limit&&G.moves>=G.limit&&!solved())fail('moves');else if(solved())complete()}
function solved(){return G.t.every(t=>!t.length||(t.length===4&&new Set(t).size===1))}
function undo(){if(!G.h.length)return toast('No move to undo');G.t=JSON.parse(G.h.pop());G.moves=Math.max(0,G.moves-1);G.combo=0;G.noUndo=false;render();beep(360)}
function restart(){start(G.n,G.daily)}
function hint(){if(S.coins<15)return toast('You need 15 coins');for(let i=0;i<G.t.length;i++)for(let j=0;j<G.t.length;j++){let a=G.t[i],b=G.t[j];if(i!==j&&a.length&&b.length<4&&(!b.length||b.at(-1)===a.at(-1))){S.coins-=15;save();G.sel=i;render();toast('💡 Try tube '+(j+1));beep(780);return}}toast('No simple hint found')}
function extra(){if(G.extra)return toast('Extra tube already active');if(S.coins<60)return toast('You need 60 coins');S.coins-=60;G.extra=true;save();render();toast('＋ Extra tube active');beep(780)}
function complete(){clearInterval(timer);if(G.noUndo)G.score+=250;G.score+=500;let stars=3;if(G.limit&&G.moves>G.limit*.75)stars=2;if(G.limit&&G.moves>G.limit*.9)stars=1;let coins=50+stars*25+(G.noUndo?25:0);S.coins+=coins;if(!G.daily){S.stars[G.n]=Math.max(S.stars[G.n]||0,stars);S.best[G.n]=Math.max(S.best[G.n]||0,G.score);S.unlocked=Math.max(S.unlocked,Math.min(101,G.n+1))}save();confetti();beep(620);$('modal').innerHTML=`<div style="color:#67e8f9;font-weight:900;letter-spacing:3px;font-size:11px">${G.daily?'DAILY CHALLENGE COMPLETE':'LEVEL COMPLETE!'}</div><h2>Perfect Sort!</h2><div class="modalstars">${[1,2,3].map(x=>x<=stars?'★':'☆').join('')}</div><p>Score <b>${G.score.toLocaleString()}</b> · Coins <b>+${coins}</b></p><div class="modal-actions"><button class="btn" onclick="closeM();restart()">↻ REPLAY</button><button class="btn" onclick="closeM();levels()">▦ LEVELS</button><button class="btn primary" onclick="closeM();start(${G.n<100?G.n+1:1})">NEXT LEVEL →</button></div>`;$('overlay').classList.add('show')}
function fail(reason){clearInterval(timer);G.failed=true;beep(120);$('modal').innerHTML=`<div style="color:#fb7185;font-weight:900;letter-spacing:3px;font-size:11px">CHALLENGE FAILED</div><h2>Almost There!</h2><p>${reason==='time'?'Time ran out.':'Move limit reached.'}</p><div class="modal-actions"><button class="btn primary" onclick="closeM();restart()">↻ RETRY</button><button class="btn" onclick="closeM();levels()">▦ LEVELS</button><button class="btn" onclick="closeM();home()">⌂ HOME</button></div>`;$('overlay').classList.add('show')}
function runTimer(){clearInterval(timer);timer=setInterval(()=>{if(G.time!=null){G.time=Math.max(0,G.time-.1);$('tm').textContent=Math.ceil(G.time);if(G.time<=0&&!solved())fail('time')}},100)}function pause(){clearInterval(timer);$('modal').innerHTML='<h2>PAUSED</h2><p>Your puzzle is waiting.</p><div class="modal-actions"><button class="btn primary" onclick="closeM();runTimer()">▶ RESUME</button><button class="btn" onclick="closeM();restart()">↻ RESTART</button></div>';$('overlay').classList.add('show')}function closeM(){$('overlay').classList.remove('show')}
function levels(){clearInterval(timer);show('levels');let g=$('grid');g.innerHTML='';for(let n=1;n<=100;n++){let e=document.createElement('button');e.className='level'+(n>S.unlocked?' lock':'');e.disabled=n>S.unlocked;e.innerHTML=`<b>${n}</b><small>${n>S.unlocked?'🔒 LOCKED':diff(n)}</small><div class="stars">${'★'.repeat(S.stars[n]||0)}${'☆'.repeat(3-(S.stars[n]||0))}</div>`;e.onclick=()=>start(n);g.appendChild(e)}}
function soundToggle(){S.sound=!S.sound;save();$('snd').textContent=S.sound?'🔊':'🔇';toast(S.sound?'Sound on':'Sound off')}function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
function beep(f){if(!S.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type='sine';g.gain.value=.04;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.12)}catch(e){}}
function toast(t){let e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e.x);e.x=setTimeout(()=>e.classList.remove('show'),1600)}function confetti(){for(let i=0;i<65;i++){let e=document.createElement('i');e.className='conf';e.style.left=Math.random()*100+'vw';e.style.background=C[i%C.length][0];e.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}}document.addEventListener('keydown',e=>{if(!$('game').classList.contains('active'))return;if(e.key.toLowerCase()==='r')restart();if(e.key.toLowerCase()==='u')undo();if(e.key.toLowerCase()==='h')hint();if(e.key.toLowerCase()==='p')pause()});updateHome();
</script></body></html>
